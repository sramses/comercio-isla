
services:
  db:
    image: postgres:16
    container_name: comercio-isla-db
    environment:
      POSTGRES_DB: comercio_isla
      POSTGRES_USER: comercio
      POSTGRES_PASSWORD: comercio_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comercio -d comercio_isla"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: comercio-isla-server
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://comercio:comercio_dev@db:5432/comercio_isla
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: cambia_este_secreto_para_desarrollo
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
